# Installs and tests every formula on macOS and Linux when the tap changes by hand.
# Formula updates from the hourly workflow are tested there before they're pushed.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the scripts
        if: runner.os == 'Linux'
        run: bash -n scripts/*.sh

      - name: Install and test
        run: scripts/test-formulas.sh
